# ═══════════════════════════════════════════
# Komodo - SonarQube Scanner Configuration
# ═══════════════════════════════════════════
# Requires SonarScanner CLI >= 5.0 (the ${env:VAR} syntax is not supported in older versions).
# Values with ${env:VAR} are resolved from environment variables at scan time.
# Configure SONAR_TOKEN, SONAR_HOST_URL, and SONAR_PROJECT_KEY in .env

sonar.projectKey=${env:SONAR_PROJECT_KEY}
sonar.organization=${env:SONAR_ORGANIZATION}
sonar.host.url=${env:SONAR_HOST_URL}
sonar.token=${env:SONAR_TOKEN}

# Sources
sonar.sources=src
sonar.exclusions=node_modules/**,dashboard/**,skills/**,memory/**,.tmp/**,docs/**

# Encoding (language auto-detected by SonarQube — supports JS, TS, and others)
sonar.sourceEncoding=UTF-8

# Test files (co-located with source)
sonar.tests=src
sonar.test.inclusions=**/*.test.js
