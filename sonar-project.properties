# ═══════════════════════════════════════════
# Komodo - SonarQube Scanner Configuration
# ═══════════════════════════════════════════
# Values with ${env:VAR} are resolved from environment variables.
# Configure SONAR_TOKEN, SONAR_HOST_URL, and SONAR_PROJECT_KEY in .env

sonar.projectKey=${env:SONAR_PROJECT_KEY}
sonar.host.url=${env:SONAR_HOST_URL}
sonar.token=${env:SONAR_TOKEN}

# Sources
sonar.sources=src
sonar.exclusions=node_modules/**,dashboard/**,skills/**,memory/**,.tmp/**,docs/**

# Language / encoding
sonar.language=js
sonar.sourceEncoding=UTF-8

# Test files (co-located with source)
sonar.tests=src
sonar.test.inclusions=**/*.test.js
